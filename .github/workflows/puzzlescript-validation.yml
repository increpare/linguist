name: Validate PuzzleScript fixture cleanup
on:
  push:
    branches: [puzzlescript-validation]
permissions:
  contents: read
jobs:
  validate:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 85d0df4d3a4f9feef9eced1ea6f45e33241c141b
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Compile and generate samples
        run: bundle exec rake samples
      - name: Run all heuristic tests
        run: bundle exec ruby -Ilib:test test/test_heuristics.rb
      - name: Run PuzzleScript full-detection test
        run: bundle exec ruby -Ilib:test test/test_blob.rb --name test_puzzlescript_txt
