name: Prepare and validate PuzzleScript
on:
  push:
    branches: [puzzlescript-validation]
permissions:
  contents: read
jobs:
  validate:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 6bd7b246df9b90f2e97d2eddca9aba59a6764d96
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-go@v6
        if: matrix.ruby == '3.3'
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.ruby == '3.3'
      - name: Fetch upstream fixtures and grammars
        run: |
          git fetch https://github.com/github-linguist/linguist.git main:refs/remotes/upstream/main v2.0.0:refs/tags/v2.0.0 test/attributes:refs/heads/test/attributes test/master:refs/heads/test/master
          git branch -f main refs/remotes/upstream/main
          git submodule init
          git submodule sync --quiet
          script/fast-submodule-update
      - name: Check generated language ID and grammar
        run: |
          script/update-ids --check
          script/grammar-compiler add vendor/grammars/puzzlescript-tmLanguage
          bundle exec rake samples
          git diff --exit-code -- grammars.yml lib/linguist/languages.yml
      - name: Check regex compatibility
        if: matrix.ruby == '3.3'
        run: script/check-regex-compatibility
      - name: Run upstream tests
        run: bundle exec rake
      - name: Check grammar licenses
        run: bundle exec licensed status -c vendor/licenses/config.yml
      - name: Classifier cross-validation
        if: matrix.ruby == '3.3'
        run: bundle exec script/cross-validation --test
