name: Validate simplified PuzzleScript heuristic
on:
  push:
    branches: [puzzlescript-validation]
permissions:
  contents: read
jobs:
  validate:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: e465019b0880b6b3a377955583a1d607219085c1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-go@v6
        if: matrix.ruby == '3.3'
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.ruby == '3.3'
      - name: Check regex compatibility
        if: matrix.ruby == '3.3'
        run: script/check-regex-compatibility
      - name: Compile and generate samples
        run: bundle exec rake samples
      - name: Run all heuristic tests
        run: bundle exec ruby -Ilib:test test/test_heuristics.rb
      - name: Run PuzzleScript full-detection test
        run: bundle exec ruby -Ilib:test test/test_blob.rb --name test_puzzlescript_txt
